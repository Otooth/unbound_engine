<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Unbound Engine</title>
  <defs>
    <linearGradient id="orbit" x1="96" y1="100" x2="420" y2="410" gradientUnits="userSpaceOnUse">
