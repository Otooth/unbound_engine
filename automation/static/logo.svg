      <stop offset=".48" stop-color="#716EFF"/>
      <stop offset="1" stop-color="#36DDD0"/>
    </linearGradient>
    <linearGradient id="core" x1="174" y1="174" x2="344" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AF64FF"/>
      <stop offset=".52" stop-color="#F1E9FF"/>
      <stop offset="1" stop-color="#36DDE2"/>
